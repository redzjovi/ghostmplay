# tbls — database documentation for ghostmplay
# Docs: https://github.com/k1LoW/tbls
# Usage:
#   pnpm docs:db       # generate docs/schema from ghostmplay.db
#   pnpm docs:db:diff  # fail in CI when docs are stale
dsn: sqlite://./ghostmplay.db
docPath: docs/schema
name: ghostmplay
desc: Windows desktop marketplace — SQLite (TypeORM 0.3 + sqljs, dev file ./ghostmplay.db)

er:
  format: mermaid
  comment: true
  hideDef: false
  distance: 2

comments:
  - table: marketplace_items
    tableComment: Listing snapshot, mirrors note.txt (id reused as item_id from market API)
    columnComments:
      id: Primary key, reused as item_id from market API
      token_id: Unique on-chain token id
      seller_id: Seller wallet/account id
      seller_name: Seller display name (nullable)
      image_url: Item image URL
      name: Item display name
      currency: Currency code, default NUMI
      price: Listing price (real)
      grade_effect: Normal | Rare (indexed)
      level: Item level
      enchant: Enchant level
      equipment_type: Equipment slot/type (indexed)
      created_at: Listing time, epoch seconds from API (equals market_time)
      mint_time: Mint timestamp (nullable)
      sold: Sold flag, default false
  - table: marketplace_item_detail
    tableComment: 1-1 detail of marketplace_items, raw jsonb mirrors kept for fidelity
    columnComments:
      item_id: PK + FK -> marketplace_items(id) ON DELETE CASCADE
      attributes: Raw attributes JSON (Level, Equipment Type, Enchant, Grade Effect)
      datas: Raw datas JSON (Basic Effect, Set Composition, Set Effect)
      infos: Raw infos JSON (title/value_name/value)
  - table: marketplace_favorites
    tableComment: Saved filter presets in UI, no FK to items
    columnComments:
      id: Autoincrement primary key
      name: Preset name (unique)
      q: Search query (nullable)
      equipment_types: JSON array filter (nullable)
      grade_effects: JSON array filter (nullable)
      sort: Sort mode, default recent
      created_at: Row creation time, default datetime('now')
      updated_at: Row update time, default datetime('now')
