# air — live reload for `make dev`.
#
# Checked in rather than passed as command-line flags so the watch rules are
# visible in a diff, and so a change to what triggers a rebuild is a reviewed
# change. `make dev` just runs `air`.
#
# air is a development tool and is not vendored. Install it with:
#   go install github.com/air-verse/air@latest
#
# `make dev` falls back to a single build-and-run when air is absent, so a
# missing tool costs you reloads rather than the ability to start the server.
#
# Everything else is left at air's defaults. A setting here that restates a
# default is a comment waiting to become a lie.

root = "."
tmp_dir = "tmp"

[build]
# cmd is the build; entrypoint is the binary air then runs. entrypoint replaces
# the deprecated `bin` key and is NOT the build command.
cmd = "go build -o bin/api ./cmd/api"
entrypoint = ["bin/api"]

# db/sqlc is excluded because it is generated: `make generate` rewrites it, so
# watching it would make a query change trigger a rebuild that itself rewrites
# watched files. Editing db/queries/*.sql still rebuilds, which is the behaviour
# that matters -- the query is the source, db/sqlc is the output.
#
# Test files are excluded because changing one is not a reason to restart a
# server you are holding a request against.
exclude_dir = ["node_modules", "bin", "tmp", "public", "db/sqlc"]
exclude_regex = ["_test\\.go$"]

# .sql and .yaml are watched because a migration or a query change really does
# change what the process does.
include_ext = ["go", "sql", "yaml", "yml", "toml"]

# Debounce, so a burst of saves from a formatter or a branch switch produces one
# rebuild rather than one per file.
delay = 100